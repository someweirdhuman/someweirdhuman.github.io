<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamline Video Player</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --accent-color: #3ea6ff;
            --card-bg: #1e1e1e;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            width: 95%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* The trick for proper sizing: Aspect Ratio Box */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: black;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
        }

        .controls-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #121212;
            color: white;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        h2 {
            margin-top: 0;
            font-weight: 400;
            font-size: 1.2rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="video-wrapper">
            <video id="videoPlayer" controls>
                <source id="videoSource" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="controls-area">
            <input type="text" id="videoInput" placeholder="Paste .mp4, .webm, or .ogg link here...">
            <button onclick="loadVideo()">Load URL</button>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const videoSource = document.getElementById('videoSource');
        const videoInput = document.getElementById('videoInput');

        function loadVideo() {
            const url = videoInput.value.trim();
            
            if (url) {
                videoSource.src = url;
                videoPlayer.load();
                videoPlayer.play().catch(e => console.log("Auto-play blocked or source invalid."));
                
                // Update URL hash without refreshing
                window.location.hash = encodeURIComponent(url);
            }
        }

        // Handle enter key
        videoInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                loadVideo();
            }
        });

        window.onload = function() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (hash && hash.startsWith('http')) {
                videoInput.value = hash;
                videoSource.src = hash;
                videoPlayer.load();
            }
        };
    </script>
</body>
</html>
